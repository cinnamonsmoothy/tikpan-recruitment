<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="View this current vacancy from Tikpan Recruitment Group.">
  <title>Vacancy | Tikpan Recruitment Group</title>
  <link rel="preconnect" href="https://recruitment-jobs-api.almondghost6.chatgpt.site" crossorigin>
  <link rel="dns-prefetch" href="//recruitment-jobs-api.almondghost6.chatgpt.site">
  <script src="./jobs-runtime-config.js?v=5"></script>
  <script src="../assets/js/jobs-source.js?v=6"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/pages.css?v=19">
  <link rel="stylesheet" href="../assets/css/jobs.css?v=4">
  <link rel="stylesheet" href="../assets/css/site-layout-v24.css" data-site-layout>
  <link rel="stylesheet" href="../assets/css/site-header.css?v=21" data-site-header-styles>
  <script src="../assets/js/site-header.js?v=23" defer></script>
</head>
<body>
  <header data-site-header data-root="../"></header>
  <main id="job-detail" aria-live="polite" aria-busy="true">
    <section class="page-hero job-detail-hero">
      <div class="container">
        <div class="label" id="job-sector">Vacancy</div>
        <h1 id="job-title">Loading vacancy…</h1>
        <div class="job-detail-meta" id="job-meta"></div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <a class="job-back" href="index.html">← All vacancies</a>
        <div class="job-detail-layout" id="job-content" hidden>
          <article class="job-detail-content">
            <h2>About the role</h2>
            <div id="job-description"></div>
          </article>
          <aside class="job-summary-card">
            <h2>Role overview</h2>
            <div id="job-facts"></div>
            <a class="button job-apply" id="job-apply" href="../index.html#contact">Apply for this role <span aria-hidden="true">↗</span></a>
          </aside>
        </div>
        <div class="jobs-empty" id="job-unavailable" hidden>
          <h3>This vacancy is no longer available.</h3>
          <p>It may have been removed or the listing may have closed.</p>
          <a class="button" href="index.html">View current vacancies</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" data-site-footer data-root="../"></footer>
  <script src="../assets/js/site-footer.js?v=19"></script>
  <script src="../assets/js/markdown.js?v=1"></script>
  <script src="../assets/js/job-detail.js?v=3"></script>
</body>
</html>
